<!DOCTYPE html>
<!-- Renders the in-game turkey for the app icons: open via a local server, see tools/README note in build_map.py -->
<html><body style="margin:0;background:transparent">
<canvas id="c"></canvas>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { makeTurkey } from '../src/game/models.js';
const size = +new URLSearchParams(location.search).get('size') || 512;
const maskable = new URLSearchParams(location.search).has('maskable');
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setSize(size, size);
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.3;
const s = new THREE.Scene();
s.add(new THREE.HemisphereLight(0xffffff, 0x886655, 2));
const sun = new THREE.DirectionalLight(0xffe0b0, 2.5); sun.position.set(-3, 4, 5); s.add(sun);
const t = makeTurkey(1); t.root.rotation.y = Math.PI - 0.5; s.add(t.root);
const cam = new THREE.PerspectiveCamera(maskable ? 42 : 34, 1, 0.1, 50);
cam.position.set(0, 1.25, 3.6); cam.lookAt(0, 0.5, 0);
r.render(s, cam);
document.title = 'ready';
</script></body></html>
